name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'checkout-api/**'
      - '.github/workflows/ci.yml'

jobs:
  ci:
    name: Install, Build, Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: checkout-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Typecheck
        run: npm run typecheck --if-present